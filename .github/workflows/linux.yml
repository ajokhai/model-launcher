# Builds the Linux release (.deb and .AppImage) on every version tag, and on demand.
name: Linux build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p ml-core
      - name: MCP server (shipped next to the app)
        run: |
          cargo build --release -p ml-mcp
          mkdir -p app/src-tauri/binaries
          cp target/release/model-launcher-mcp "app/src-tauri/binaries/model-launcher-mcp-$(rustc -vV | sed -n 's/host: //p')"
      - name: App
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage --config app/src-tauri/tauri.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: model-launcher-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage --clobber
